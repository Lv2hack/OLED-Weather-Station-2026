<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 500" width="830" height="500" font-family="Helvetica, Arial, sans-serif">
  <rect width="830" height="500" fill="#ffffff"/>

  <!-- D1 mini -->
  <rect x="250" y="60" width="160" height="340" rx="8" fill="#1d4f91"/>
  <rect x="285" y="66" width="90" height="26" rx="3" fill="#c9ccd1"/>
  <text x="330" y="84" font-size="12" text-anchor="middle" fill="#333">ESP8266</text>
  <text x="330" y="236" font-size="18" font-weight="bold" text-anchor="middle" fill="#fff">D1 mini</text>
  <text x="330" y="256" font-size="11" text-anchor="middle" fill="#cfe0ff">top view</text>
  <rect x="310" y="400" width="40" height="16" rx="2" fill="#9aa0a6"/>
  <text x="330" y="434" font-size="11" text-anchor="middle" fill="#555">USB</text>

  <!-- left pins -->
  <g font-size="13" fill="#ffffff">
    <text x="276" y="105">RST</text><text x="276" y="145">A0</text><text x="276" y="185">D0</text>
    <text x="276" y="225">D5</text><text x="276" y="265" font-weight="bold">D6</text><text x="276" y="305" font-weight="bold">D7</text>
    <text x="276" y="345">D8</text><text x="276" y="385" font-weight="bold">3V3</text>
  </g>
  <g fill="#e8c35a">
    <circle cx="262" cy="100" r="5"/><circle cx="262" cy="140" r="5"/><circle cx="262" cy="180" r="5"/>
    <circle cx="262" cy="220" r="5"/><circle cx="262" cy="260" r="5"/><circle cx="262" cy="300" r="5"/>
    <circle cx="262" cy="340" r="5"/><circle cx="262" cy="380" r="5"/>
  </g>
  <!-- right pins -->
  <g font-size="13" fill="#ffffff" text-anchor="end">
    <text x="384" y="105">TX</text><text x="384" y="145">RX</text><text x="384" y="185">D1</text>
    <text x="384" y="225" font-weight="bold">D2</text><text x="384" y="265" font-weight="bold">D3</text><text x="384" y="305">D4</text>
    <text x="384" y="345" font-weight="bold">G</text><text x="384" y="385">5V</text>
  </g>
  <g fill="#e8c35a">
    <circle cx="398" cy="100" r="5"/><circle cx="398" cy="140" r="5"/><circle cx="398" cy="180" r="5"/>
    <circle cx="398" cy="220" r="5"/><circle cx="398" cy="260" r="5"/><circle cx="398" cy="300" r="5"/>
    <circle cx="398" cy="340" r="5"/><circle cx="398" cy="380" r="5"/>
  </g>

  <!-- OLED -->
  <rect x="560" y="40" width="250" height="180" rx="6" fill="#2b2f36"/>
  <rect x="615" y="55" width="182" height="150" rx="2" fill="#05070a"/>
  <text x="706" y="122" font-size="15" text-anchor="middle" fill="#e6e9ed">2.42" OLED</text>
  <text x="706" y="142" font-size="12" text-anchor="middle" fill="#98a1ab">128x64, SSD1309, I2C</text>
  <g font-size="13" fill="#ffffff">
    <text x="574" y="85">GND</text><text x="574" y="115">VCC</text><text x="574" y="145">SCL</text><text x="574" y="175">SDA</text>
  </g>
  <g fill="#e8c35a">
    <rect x="556" y="76" width="9" height="9"/><rect x="556" y="106" width="9" height="9"/>
    <rect x="556" y="136" width="9" height="9"/><rect x="556" y="166" width="9" height="9"/>
  </g>

  <!-- wires -->
  <g fill="none" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <!-- GND: G to OLED GND -->
    <polyline points="398,340 470,340 470,80 558,80" stroke="#222222"/>
    <!-- SCL: D2 -->
    <polyline points="398,220 500,220 500,140 558,140" stroke="#e0a800"/>
    <!-- SDA: D3 -->
    <polyline points="398,260 525,260 525,170 558,170" stroke="#1f6feb"/>
    <!-- VCC: 3V3 around the bottom -->
    <polyline points="262,380 225,380 225,460 545,460 545,110 558,110" stroke="#d32f2f"/>
    <!-- Button: D7 -->
    <polyline points="262,300 168,300" stroke="#2e9e44"/>
    <!-- Button: other leg to GND -->
    <polyline points="112,300 70,300 70,30 470,30 470,80" stroke="#222222"/>
  </g>
  <circle cx="470" cy="80" r="6" fill="#222222"/>

  <!-- push button -->
  <circle cx="115" cy="300" r="5" fill="#fff" stroke="#333" stroke-width="2.5"/>
  <circle cx="165" cy="300" r="5" fill="#fff" stroke="#333" stroke-width="2.5"/>
  <line x1="106" y1="284" x2="174" y2="284" stroke="#333" stroke-width="3"/>
  <line x1="140" y1="284" x2="140" y2="270" stroke="#333" stroke-width="3"/>
  <line x1="130" y1="270" x2="150" y2="270" stroke="#333" stroke-width="3"/>
  <text x="140" y="328" font-size="13" text-anchor="middle" fill="#333">Push button</text>

  <!-- legend -->
  <g font-size="13" fill="#333">
    <text x="600" y="262" font-weight="bold">Connections</text>
    <text x="600" y="284">OLED GND  →  G</text>
    <text x="600" y="304">OLED VCC  →  3V3</text>
    <text x="600" y="324">OLED SCL  →  D2</text>
    <text x="600" y="344">OLED SDA  →  D3</text>
    <text x="600" y="364">Button     →  D7 and G</text>
    <text x="600" y="400" fill="#666">7-pin display: also RES → D6,</text>
    <text x="600" y="418" fill="#666">DC and CS → GND (see BUILD.md)</text>
  </g>
</svg>
